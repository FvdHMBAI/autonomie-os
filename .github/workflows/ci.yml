name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq bc postgresql-client

      - name: Set permissions
        run: find . -name "*.sh" -exec chmod +x {} \;

      - name: ShellCheck
        run: |
          sudo apt-get install -y -qq shellcheck
          find . -name "*.sh" -not -path './.git/*' | while read f; do
            echo "Checking $f..."
            shellcheck -S warning -e SC1091,SC2034,SC2154 "$f" || true
          done

      - name: Python syntax check
        run: |
          python3 -c "
          import py_compile, sys, os
          errors = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          py_compile.compile(path, doraise=True)
                          print(f'OK: {path}')
                      except py_compile.PyCompileError as e:
                          print(f'FAIL: {path}: {e}')
                          errors += 1
          sys.exit(errors)
          "

      - name: SQL syntax check
        run: |
          echo "Checking SQL balanced parentheses..."
          OPEN=$(cat schema.sql | tr -cd '(' | wc -c)
          CLOSE=$(cat schema.sql | tr -cd ')' | wc -c)
          if [ "$OPEN" != "$CLOSE" ]; then
            echo "FAIL: Unbalanced parentheses ($OPEN open, $CLOSE close)"
            exit 1
          fi
          echo "OK: $OPEN balanced pairs"

          echo "Checking SQL semicolons..."
          STMTS=$(grep -c ';$' schema.sql || echo 0)
          echo "OK: $STMTS statements"

      - name: Run tests
        run: |
          chmod +x tests/test-autonomie.sh
          bash tests/test-autonomie.sh -v

      - name: No internal paths leaked
        run: |
          if grep -rn '/opt/scripts\|/opt/obsidian\|88\.99\.82\|178\.105\.140' \
            --include='*.sh' --include='*.py' --include='*.sql' \
            --exclude-dir=.git .; then
            echo "FAIL: Internal paths found in code"
            exit 1
          fi
          echo "OK: No internal paths"
